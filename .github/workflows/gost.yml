name: GOST published targets

on:
  pull_request:
    paths:
      - 'pkgs/g/gost.lua'
      - 'tests/g/test_gost.py'
      - '.github/workflows/gost.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pyyaml # host-dep-ok: runner test harness, not package runtime
      - uses: ./.github/actions/setup-xlings
        with:
          version: v2026.10.26.1
      - name: Install and verify GOST in the runner home
        env:
          XLINGS_TEST_SUBOS: default
        run: python -m pytest tests/g/test_gost.py -m "index or lifecycle or verify" -q
      - name: Remove GOST and check registrations
        shell: bash
        run: |
          xlings remove local:gost --yes --agent
          python - <<'PY'
          import json, os
          from pathlib import Path
          home = Path(os.environ['XLINGS_HOME'])
          workspace = json.loads((home / 'subos/default/.xlings.json').read_text()).get('workspace') or {}
          assert 'gost' not in workspace, workspace
          for suffix in ('', '.exe', '.cmd'):
              shim = home / 'subos/default/bin' / ('gost' + suffix)
              assert not shim.exists() and not shim.is_symlink(), shim
          PY

  # These targets have upstream GOST binaries but no matching native xlings
  # release. Exercise payload behavior separately, without claiming lifecycle.
  payload:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, asset: linux_386.tar.gz, emulator: ''}
          - {os: ubuntu-latest, asset: linux_armv7.tar.gz, emulator: qemu-arm}
          - {os: ubuntu-latest, asset: linux_riscv64.tar.gz, emulator: qemu-riscv64}
          - {os: macos-15-intel, asset: darwin_amd64.tar.gz, emulator: ''}
          - {os: windows-latest, asset: windows_386.zip, emulator: ''}
          - {os: windows-11-arm, asset: windows_arm64.zip, emulator: ''}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest # host-dep-ok: runner payload test harness
      - name: Install userspace emulator for the payload smoke test
        if: matrix.emulator != ''
        run: sudo apt-get update -qq && sudo apt-get install -y qemu-user # host-dep-ok: cross-architecture test harness
      - name: Download and verify the published payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_SUFFIX: ${{ matrix.asset }}
          EMULATOR: ${{ matrix.emulator }}
        run: |
          python - <<'PY'
          import hashlib, os, re, shutil, subprocess, tarfile, zipfile
          from pathlib import Path
          text = Path('pkgs/g/gost.lua').read_text()
          version = re.search(r'\["latest"\]\s*=\s*\{\s*ref\s*=\s*"([^"]+)"', text).group(1)
          asset = f'gost_{version}_' + os.environ['ASSET_SUFFIX']
          root = Path(os.environ['RUNNER_TEMP']) / 'gost-payload-home'
          root.mkdir()
          downloads = root / 'downloads'
          downloads.mkdir()
          subprocess.run(['gh', 'release', 'download', 'v' + version, '--repo', 'go-gost/gost',
                          '--pattern', asset, '--pattern', 'checksums.txt', '--dir', str(downloads)], check=True)
          checksums = {name: digest for digest, name in
                       (line.split() for line in (downloads / 'checksums.txt').read_text().splitlines())}
          digest = hashlib.sha256((downloads / asset).read_bytes()).hexdigest()
          assert digest == checksums[asset] and digest in text
          payload = root / 'payload'
          payload.mkdir()
          if asset.endswith('.zip'):
              with zipfile.ZipFile(downloads / asset) as archive:
                  archive.extractall(payload)
          else:
              with tarfile.open(downloads / asset) as archive:
                  assert not any(m.islnk() or m.issym() for m in archive)
                  archive.extractall(payload, filter='data')
          binary = payload / ('gost.exe' if os.name == 'nt' else 'gost')
          if os.name != 'nt':
              binary.chmod(0o755)
          emulator = os.environ['EMULATOR']
          if emulator:
              import shlex
              wrapper = root / 'gost-smoke'
              wrapper.write_text('#!/bin/sh\nexec ' + shlex.quote(shutil.which(emulator)) +
                                 ' ' + shlex.quote(str(binary)) + ' "$@"\n')
              wrapper.chmod(0o755)
              binary = wrapper
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'XLINGS_HOME={root}\nGOST_TEST_BINARY={binary}\nXLINGS_TEST_VERSION={version}\n')
          PY
      - name: Verify version and a real local HTTP proxy request
        run: python -m pytest tests/g/test_gost.py -m verify -k "version or local_http_proxy" -q
