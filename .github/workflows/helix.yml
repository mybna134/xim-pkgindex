name: Helix published platforms

on:
  pull_request:
    paths:
      - 'pkgs/h/helix.lua'
      - 'tests/h/test_helix.py'
      - '.github/workflows/helix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pyyaml # host-dep-ok: runner test harness, not package runtime
      - uses: ./.github/actions/setup-xlings
        with:
          version: v2026.10.26.1
      - name: Install and verify Helix in the runner home
        env:
          XLINGS_TEST_SUBOS: default
        run: python -m pytest tests/h/test_helix.py -q
      - name: Remove Helix and check registrations
        shell: bash
        run: |
          xlings remove local:helix --yes --agent
          python - <<'PY'
          import json, os
          from pathlib import Path
          home = Path(os.environ['XLINGS_HOME'])
          workspace = json.loads((home / 'subos/default/.xlings.json').read_text()).get('workspace') or {}
          assert 'hx' not in workspace and 'helix' not in workspace, workspace
          for suffix in ('', '.exe', '.cmd'):
              shim = home / 'subos/default/bin' / ('hx' + suffix)
              assert not shim.exists() and not shim.is_symlink(), shim
          PY

  # Intel macOS has a Helix payload, but no matching native xlings release.
  payload-intel:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest # host-dep-ok: runner payload test harness
      - name: Verify and extract the Intel macOS payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, json, os, re, subprocess, tarfile
          from pathlib import Path
          text = Path('pkgs/h/helix.lua').read_text()
          version = re.search(r'\["latest"\]\s*=\s*\{\s*ref\s*=\s*"([^"]+)"', text).group(1)
          asset = f'helix-{version}-x86_64-macos.tar.xz'
          root = Path(os.environ['RUNNER_TEMP']) / 'helix-payload-home'
          root.mkdir()
          subprocess.run(['gh', 'release', 'download', version, '--repo', 'helix-editor/helix',
                          '--pattern', asset, '--dir', str(root)], check=True)
          release = json.loads(subprocess.check_output(
              ['gh', 'api', f'repos/helix-editor/helix/releases/tags/{version}'], text=True))
          published = next(a for a in release['assets'] if a['name'] == asset)
          digest = hashlib.sha256((root / asset).read_bytes()).hexdigest()
          assert published['digest'] == 'sha256:' + digest and digest in text
          with tarfile.open(root / asset) as archive:
              assert not any(m.islnk() or m.issym() for m in archive)
              archive.extractall(root, filter='data')
          binary = root / asset.removesuffix('.tar.xz') / 'hx'
          binary.chmod(0o755)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'XLINGS_HOME={root}\nHELIX_TEST_BINARY={binary}\nXLINGS_TEST_VERSION={version}\n')
          PY
      - name: Verify version and bundled parser, themes and queries
        run: python -m pytest tests/h/test_helix.py -m verify -k "version or runtime" -q
